
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Notice Board</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fc;color:#19264d}
header{background:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:23px;font-weight:bold}
main{max-width:1200px;margin:40px auto;padding:0 20px}
.hero{background:linear-gradient(110deg,#192953,#354fc0);color:white;padding:55px;border-radius:24px}
.hero h1{font-size:42px;margin:15px 0}
.hero p{font-size:18px;line-height:1.6}
button{background:#3155dc;color:white;border:0;padding:14px 24px;border-radius:9px;cursor:pointer;font-weight:bold}
.search{display:flex;gap:12px;margin:30px 0}
input{padding:15px;border:1px solid #ddd;border-radius:9px;flex:1;font-size:16px}
.notice{background:white;padding:22px;margin:15px 0;border-radius:12px;box-shadow:0 3px 12px #ddd}
.notice h3{margin-top:0}
.tag{color:#3155dc;font-weight:bold}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
<div class="brand">📌 Campus Notice Board</div>
<div>Home | Student</div>
</header>
<main>
<section class="hero">
<p>CAMPUS UPDATES, ALL IN ONE PLACE</p>
<h1>Stay informed.<br>Stay connected.</h1>
<p>Find the latest college announcements, events, exam updates and important information.</p>
</section>
<div class="search">
<input id="search" placeholder="Search notices by title or content..." oninput="showNotices()">
<button onclick="showNotices()">Search</button>
</div>
<h2>Latest Updates</h2>
<div id="notices"></div>
</main>
<footer>© 2026 Campus Notice Board</footer>
<script>
const notices=[
{title:"Internal Assessment Examination",category:"Exam",date:"November 10, 2026",content:"All students are informed to prepare for the upcoming internal assessment examinations. Check your department timetable."},
{title:"College Symposium 2026",category:"Event",date:"November 15, 2026",content:"Registration is open for the college technical symposium. Interested students can register through their department."},
{title:"Placement Training",category:"Placement",date:"November 20, 2026",content:"A placement training session will be conducted for final-year students. Attendance is important."},
{title:"Sports Day Announcement",category:"Sports",date:"November 25, 2026",content:"Students interested in sports events can register with the physical education department."}
];
function showNotices(){
const q=document.getElementById("search").value.toLowerCase();
const filtered=notices.filter(n=>(n.title+" "+n.content+" "+n.category).toLowerCase().includes(q));
document.getElementById("notices").innerHTML=filtered.length?filtered.map(n=>`<div class="notice"><span class="tag">${n.category}</span><h3>${n.title}</h3><p>${n.content}</p><small>📅 ${n.date}</small></div>`).join(""):"<p>No notices found.</p>";
}
showNotices();
</script>
</body>
</html>
